<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
    <main>
        <div class="form-card">
            <h1 th:text="${mode == 'create' ? 'Thêm Sản phẩm mới' : 'Chỉnh sửa Sản phẩm'}"></h1>

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <form th:object="${productDTO}" method="post" enctype="multipart/form-data"
                  th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}">

                <input type="hidden" th:field="*{id}">

                <div>
                    <label for="name">Tên sản phẩm</label>
                    <input id="name" th:field="*{name}" placeholder="Nhập tên sản phẩm">
                    <small class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                </div>

                <div>
                    <label for="description">Mô tả sản phẩm</label>
                    <textarea id="description" th:field="*{description}" rows="4" placeholder="Nhập mô tả chi tiết..."></textarea>
                </div>

                <div>
                    <label for="price">Giá bán (VNĐ)</label>
                    <input id="price" type="number" step="1000" th:field="*{price}" placeholder="Ví dụ: 150000">
                    <small class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
                </div>

                <div>
                    <label for="image">Tải lên hình ảnh (Cloudinary)</label>
                    <input id="image" type="file" name="image" accept="image/*">
                </div>

                <!-- Preview ảnh hiện tại nếu có -->
                <div th:if="${productDTO.imageUrl != null and !#strings.isEmpty(productDTO.imageUrl)}" style="margin: 15px 0;">
                    <p style="font-size: 13px; color: #64748b; margin-bottom: 5px;">Ảnh hiện tại:</p>
                    <img th:src="${#strings.substringBefore(productDTO.imageUrl, '|')}" class="preview" alt="Preview Image">
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="button">Lưu sản phẩm</button>
                    <a class="button secondary" th:href="@{/products}">Hủy</a>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
