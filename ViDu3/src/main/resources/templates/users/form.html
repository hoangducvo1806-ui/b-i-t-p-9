<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm User' : 'Sửa User'})}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
    <main>
        <div class="form-card">
            <h1 th:text="${mode == 'create' ? 'Thêm User mới' : 'Cập nhật User'}"></h1>

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <form th:object="${userDTO}" method="post"
                  th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">

                <label>Username</label>
                <input th:field="*{username}" placeholder="Nhập username" th:readonly="${mode == 'edit'}">
                <small class="error-text" th:errors="*{username}"></small>

                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="example@gmail.com">
                <small class="error-text" th:errors="*{email}"></small>

                <label>Họ và tên</label>
                <input th:field="*{fullName}" placeholder="Nhập họ và tên">
                <small class="error-text" th:errors="*{fullName}"></small>

                <label>Vai trò (Role)</label>
                <select th:field="*{roleName}">
                    <option value="ROLE_USER">ROLE_USER (Khách hàng)</option>
                    <option value="ROLE_ADMIN">ROLE_ADMIN (Quản trị viên)</option>
                </select>

                <div style="margin: 15px 0;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" th:field="*{enabled}" style="width: auto; margin: 0;"> Kích hoạt tài khoản (Enabled)
                    </label>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="button">Lưu thông tin</button>
                    <a class="button secondary" th:href="@{/users}">Hủy</a>
                </div>
            </form>

            <p th:if="${mode == 'create'}" class="note">
                Lưu ý: Mật khẩu mặc định khi tạo mới User là <b>123456</b>.
            </p>
        </div>
    </main>
</div>

</body>
</html>
