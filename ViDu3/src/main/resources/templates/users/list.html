<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quản lý Users')}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
    <main>
        <h1>Quản lý Users</h1>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <div class="toolbar">
            <form th:action="@{/users}" method="get">
                <input name="keyword" th:value="${keyword}" placeholder="Tìm theo username, email, họ tên...">
                <input type="hidden" name="size" th:value="${size}">
                <button type="submit" class="button">Tìm kiếm</button>
            </form>
            <a class="button" th:href="@{/users/create}">+ Thêm User</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Họ tên</th>
                    <th>Role</th>
                    <th>Trạng thái</th>
                    <th>Số Products</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users.content}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.username}">user01</td>
                    <td th:text="${u.email}">user01@gmail.com</td>
                    <td th:text="${u.fullName}">Nguyễn Văn A</td>
                    <td><span class="badge" th:text="${u.roleName}">ROLE_USER</span></td>
                    <td th:text="${u.enabled ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</td>
                    <td style="text-align: center; font-weight: bold;" th:text="${u.productCount}">0</td>
                    <td class="actions">
                        <a th:href="@{/users/edit/{id}(id=${u.id})}" class="button" style="padding: 5px 10px; font-size: 12px;">Sửa</a>
                        <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa user này không?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="danger-link" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${users.empty}">
                    <td colspan="8" style="text-align: center; padding: 20px;">Không tìm thấy user nào phù hợp.</td>
                </tr>
            </tbody>
        </table>

        <!-- Phân trang -->
        <div class="pagination" th:if="${users.totalPages > 1}">
            <a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number - 1}, size=${size}, keyword=${keyword})}">« Trước</a>
            <span th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
                <a th:classappend="${i == users.number ? 'active' : ''}"
                   th:href="@{/users(page=${i}, size=${size}, keyword=${keyword})}"
                   th:text="${i + 1}">1</a>
            </span>
            <a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number + 1}, size=${size}, keyword=${keyword})}">Sau »</a>
        </div>
    </main>
</div>

</body>
</html>
