<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>Quên mật khẩu</h1>
        <p style="color: #64748b; font-size: 14px; margin-top: -5px;">Nhập email của bạn để nhận mã xác thực OTP khôi phục mật khẩu.</p>

        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="example@gmail.com" required autofocus>
            <small class="error-text" th:errors="*{email}"></small>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="button full" type="submit">Gửi mã OTP</button>
        </form>

        <p style="margin-top: 15px;">
            <a th:href="@{/login}">Quay lại Đăng nhập</a>
        </p>
    </div>
</div>

</body>
</html>
