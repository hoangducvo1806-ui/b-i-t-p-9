<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>Đăng nhập</h1>

        <div th:if="${param.error}" class="alert error">
            Username/password không đúng hoặc tài khoản chưa được kích hoạt OTP.
        </div>
        <div th:if="${param.logout}" class="alert success">
            Bạn đã đăng xuất thành công.
        </div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div>
                <label>Username</label>
                <input name="username" required autofocus placeholder="Nhập username">
            </div>

            <div>
                <label>Password</label>
                <input type="password" name="password" required placeholder="Nhập password">
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="button full" type="submit">Đăng nhập</button>
        </form>

        <p style="margin-top: 15px;">
            <a th:href="@{/register}">Chưa có tài khoản? Đăng ký ngay</a>
        </p>
        <p>
            <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </p>
    </div>
</div>

</body>
</html>
