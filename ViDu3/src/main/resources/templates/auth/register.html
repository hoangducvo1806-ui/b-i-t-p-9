<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng ký')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>Đăng ký tài khoản</h1>

        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <form th:action="@{/register}" th:object="${registerDTO}" method="post">
            <label>Username</label>
            <input th:field="*{username}" placeholder="Nhập username">
            <small class="error-text" th:errors="*{username}"></small>

            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="example@gmail.com">
            <small class="error-text" th:errors="*{email}"></small>

            <label>Họ và tên</label>
            <input th:field="*{fullName}" placeholder="Nguyễn Văn A">
            <small class="error-text" th:errors="*{fullName}"></small>

            <label>Mật khẩu</label>
            <input type="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự">
            <small class="error-text" th:errors="*{password}"></small>

            <label>Xác nhận mật khẩu</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu">
            <small class="error-text" th:errors="*{confirmPassword}"></small>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="button full" type="submit">Đăng ký & Nhận mã OTP</button>
        </form>

        <p style="margin-top: 15px;">
            <a th:href="@{/login}">Đã có tài khoản? Đăng nhập</a>
        </p>
    </div>
</div>

</body>
</html>
