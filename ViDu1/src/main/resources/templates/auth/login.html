<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body class="auth-page">

<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng nhập bằng Email</h2>

    <div class="alert error" th:if="${param.error}">
        Email hoặc mật khẩu không chính xác!
    </div>
    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công!
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email" required autofocus>
        </div>

        <div>
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button class="btn primary full" type="submit">Đăng nhập</button>
    </form>

    <div style="margin-top: 15px; font-size: 13px; color: #64748b;">
        <p>Tài khoản demo:</p>
        <p>• Admin: <b>trungnh@hcmute.edu.vn</b> / <b>123456</b></p>
        <p>• User: <b>user01@gmail.com</b> / <b>123456</b></p>
    </div>
</div>

</body>
</html>
