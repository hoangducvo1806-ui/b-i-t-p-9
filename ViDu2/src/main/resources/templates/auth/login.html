<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Vi du 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <h2>Đăng nhập</h2>
    <p style="color: #64748b; font-size: 14px; margin-top: -10px;">Có thể đăng nhập bằng <b>Username</b> hoặc <b>Email</b></p>

    <div class="alert error" th:if="${param.error}">
        Username/email hoặc password không đúng!
    </div>
    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công!
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Username hoặc Email</label>
            <input type="text" id="username" name="username" placeholder="Nhập username hoặc email" required autofocus>
        </div>

        <div>
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button type="submit" class="btn primary full">Đăng nhập</button>
    </form>

    <div style="margin-top: 20px; font-size: 13px; color: #64748b; background: #f8fafc; padding: 12px; border-radius: 8px;">
        <p style="margin: 0 0 6px; font-weight: bold;">Tài khoản kiểm thử:</p>
        <p style="margin: 2px 0;">1. Bằng Username: <b>user01</b> / <b>123456</b></p>
        <p style="margin: 2px 0;">2. Bằng Email: <b>user01@gmail.com</b> / <b>123456</b></p>
    </div>
</div>

</body>
</html>
