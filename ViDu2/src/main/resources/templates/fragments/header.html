<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="topbar">
    <nav class="topbar-nav">
        <a class="brand" th:href="@{/}">UTEShop</a>

        <div class="user-info" th:if="${#authorization.expression('isAuthenticated()')}">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images)
                          ? #authentication.principal.images
                          : '/images/avatar-default.png'}"
                 alt="Avatar"
                 width="40"
                 height="40"
                 style="border-radius:50%; object-fit:cover; vertical-align: middle; border: 2px solid #fff;">

            <!-- Full Name -->
            <span class="user-fullname" th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>

            <!-- Username -->
            <span class="user-username" th:text="'(' + ${#authentication.principal.username} + ')'"> (username) </span>

            <!-- Email -->
            <span class="user-email" th:text="${#authentication.principal.email}"> email@gmail.com </span>

            <!-- Role -->
            <span class="badge" th:text="${#authentication.principal.role}">ROLE_USER</span>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 10px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-logout">Đăng xuất</button>
            </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a class="btn-login-link" th:href="@{/login}">Đăng nhập</a>
        </div>
    </nav>
</header>

</body>
</html>
